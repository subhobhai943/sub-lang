name: Windows MSI

# Building the installer is the one part of a release that nothing else
# exercises, so it used to be discovered broken at release time. This is a
# reusable workflow: CI calls it on every push to prove it still builds, and
# the release workflow calls it with the real version. One definition, so
# the thing CI checks is the thing that ships.

on:
  workflow_call:
    inputs:
      version:
        description: 'Release tag, e.g. v1.0.8 (a dev build if omitted)'
        required: false
        type: string
        default: '0.0.0-dev'
      wix_version:
        description: 'Four-part numeric version for the MSI itself'
        required: false
        type: string
        default: '0.0.0.0'
      upload:
        description: 'Keep the .msi as an artifact'
        required: false
        type: boolean
        default: true

jobs:
  msi:
    name: build MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Build the tools
        shell: msys2 {0}
        run: make all

      - name: Smoke test
        shell: msys2 {0}
        run: |
          printf 'let x = 42\nprintln(x)\n' > smoke.sb
          ./subi.exe smoke.sb
          ./subc.exe smoke.sb -o smoke_bin
          ./smoke_bin.exe
          ./sub.exe smoke.sb python

      - name: Stage files for WiX
        shell: pwsh
        run: |
          Copy-Item sub.exe, subc.exe, subi.exe, LICENSE, README.md `
                    -Destination installer\windows -Force
          Get-ChildItem installer\windows

      - name: Install WiX Toolset v4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add the WiX UI extension
        shell: pwsh
        run: wix extension add --global WixToolset.UI.wixext/4.0.5

      - name: Build MSI
        shell: pwsh
        run: |
          $name = "sub-lang-${{ inputs.version }}-windows-x86_64.msi"
          # -bindpath so the licence RTF, the icon and the staged binaries
          # all resolve regardless of the working directory.
          wix build installer\windows\sub-lang.wxs `
            -bindpath installer\windows `
            -d Version=${{ inputs.wix_version }} `
            -ext WixToolset.UI.wixext `
            -o $name
          if (-not (Test-Path $name)) { throw "wix build produced no .msi" }
          "MSI_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check what is inside the MSI
        shell: pwsh
        run: |
          # An installer that installs nothing still builds, so look inside.
          $ErrorActionPreference = "Stop"
          $msi = Get-Item $env:MSI_NAME
          Write-Host ("{0}  {1:N0} bytes" -f $msi.Name, $msi.Length)

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember(
                  "OpenDatabase", "InvokeMethod", $null, $installer, @($msi.FullName, 0))

          function Get-MsiRows([string]$sql) {
            try {
              $view = $db.GetType().InvokeMember("OpenView", "InvokeMethod", $null, $db, @($sql))
            } catch {
              # A missing table fails here rather than returning nothing, and
              # the COM error alone does not say which query was at fault.
              throw "query failed: $sql"
            }
            # [void] matters: anything these calls emit would otherwise be
            # returned alongside the rows and turn the result into nonsense.
            [void]$view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null)
            $out = New-Object System.Collections.Generic.List[string]
            while ($true) {
              $rec = $view.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $view, $null)
              if ($null -eq $rec) { break }
              $out.Add([string]$rec.GetType().InvokeMember(
                         "StringData", "GetProperty", $null, $rec, @(1)))
            }
            [void]$view.GetType().InvokeMember("Close", "InvokeMethod", $null, $view, $null)
            return ,$out.ToArray()
          }

          $files = Get-MsiRows "SELECT FileName FROM File"
          Write-Host "Files:       $($files -join ', ')"
          foreach ($want in @("sub.exe", "subc.exe", "subi.exe")) {
            if (-not ($files -match [regex]::Escape($want))) {
              throw "$want is missing from the MSI"
            }
          }

          $ver = (Get-MsiRows "SELECT Value FROM Property WHERE Property='ProductVersion'")[0]
          Write-Host "Version:     $ver"
          if ($ver -ne "${{ inputs.wix_version }}") {
            throw "MSI ProductVersion is '$ver', expected '${{ inputs.wix_version }}'"
          }

          # The .sb association and the PATH entry are the two things a user
          # notices if they silently stop being registered.
          #
          # Which table holds the association depends on how WiX compiled the
          # ProgId: an advertised one goes to Extension/ProgId, a plain one to
          # Registry as ordinary HKCR keys. Rather than assume, list the
          # tables the MSI actually has and look in the one that is there --
          # and if neither is, say so with the list, because a query against a
          # missing table throws a COM error that names nothing.
          $tables = Get-MsiRows "SELECT Name FROM _Tables"
          Write-Host "Tables:      $($tables -join ', ')"

          if ($tables -contains "Registry") {
            $keys = Get-MsiRows "SELECT Key FROM Registry"
            Write-Host "Registry:    $($keys -join ', ')"
            if (-not ($keys -contains ".sb")) { throw ".sb file association is missing" }
          } elseif ($tables -contains "Extension") {
            $ext = Get-MsiRows "SELECT Extension FROM Extension"
            Write-Host "Extensions:  $($ext -join ', ')"
            if (-not ($ext -contains "sb")) { throw ".sb file association is missing" }
          } else {
            throw "no Registry or Extension table, so nothing registers .sb"
          }

          $envRows = Get-MsiRows "SELECT Name FROM Environment"
          Write-Host "Environment: $($envRows -join ', ')"
          if (-not ($envRows -match "PATH")) { throw "PATH entry is missing" }

          Write-Host "MSI contents check passed."

      - name: Upload MSI
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: "*.msi"
          retention-days: 5
