# Checks the claim that makes this configuration worth having: that GitHub
# actually colours .sb files, and that the editor grammar still describes the
# language the lexer parses.
#
# The previous version of this workflow validated that a JSON file parsed and
# that .gitattributes contained the string "*.sb", then printed ".sb files
# will be highlighted with SUB syntax". It passed for months while nothing was
# highlighted at all: the attribute named a language -- SUB -- that Linguist
# has never heard of, so GitHub ignored it and rendered .sb as plain text.
# Every step below asserts something that would have caught that.
name: Syntax Highlighting

on:
  push:
    paths:
      - '**.sb'
      - '**.md'
      - '.gitattributes'
      - '.vscode-extension/syntaxes/**'
      - 'src/core/lexer.c'
      - 'src/core/parser_enhanced.c'
      - 'tests/grammar_keywords.py'
      - '.github/workflows/syntax-highlighting.yml'
  pull_request:
  workflow_dispatch:

jobs:
  github-highlighting:
    name: GitHub renders .sb as a known language
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install Linguist
        run: gem install github-linguist --no-document

      - name: The language .sb maps to must exist in Linguist
        run: |
          set -euo pipefail
          sample=$(git ls-files '*.sb' | head -1)
          echo "sample file: $sample"
          lang=$(git check-attr linguist-language -- "$sample" | sed 's/.*: //')
          echo "linguist-language for .sb = $lang"
          echo "lang=$lang" >> "$GITHUB_ENV"
          if [ "$lang" = "unspecified" ]; then
            echo "::error::.gitattributes sets no linguist-language for *.sb," \
                 "so GitHub renders them as plain text."
            exit 1
          fi
          # The whole failure mode being guarded against: naming a language
          # Linguist does not have is silently ignored, not an error.
          ruby -e '
            require "linguist"
            name = ARGV[0]
            lang = Linguist::Language.find_by_name(name) || Linguist::Language.find_by_alias(name)
            if lang.nil?
              warn "::error::Linguist has no language #{name.inspect}, so GitHub " \
                   "ignores the .gitattributes override and .sb files render as plain text."
              exit 1
            end
            puts "OK: #{lang.name} (grammar #{lang.tm_scope})"
            if lang.tm_scope == "none"
              warn "::error::#{lang.name} has no grammar, so it gets no highlighting."
              exit 1
            end
          ' "$lang"

      - name: Linguist agrees, on a real file
        run: |
          set -euo pipefail
          # github-linguist reports what GitHub itself would report, reading
          # the same .gitattributes. This is the end-to-end check: everything
          # above could pass while the attribute failed to apply to the file.
          sample=$(git ls-files '*.sb' | head -1)
          out=$(github-linguist "$sample")
          echo "$out"
          if ! printf '%s' "$out" | grep -qi "language:[[:space:]]*$lang"; then
            echo "::error::Linguist does not report $sample as $lang."
            exit 1
          fi

      - name: Markdown code fences name a language GitHub knows
        run: |
          set -euo pipefail
          # ```sub is not a Linguist alias, so a fenced SUB example renders
          # grey. Fences must use an alias of whatever *.sb maps to.
          if grep -rn '^```sub$' --include='*.md' . ; then
            echo "::error::Those fences use \`\`\`sub, which Linguist does not know," \
                 "so the block renders unhighlighted. Use the alias that matches" \
                 "the linguist-language set in .gitattributes."
            exit 1
          fi
          echo "no unknown code fences"

  editor-grammar:
    name: Editor grammar matches the lexer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Grammar is valid JSON
        run: python3 -c "import json; json.load(open('.vscode-extension/syntaxes/sub.tmLanguage.json'))"

      - name: Grammar covers every keyword, and invents none
        run: python3 tests/grammar_keywords.py

      - name: The VS Code extension points at that grammar
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          pkg = json.load(open(".vscode-extension/package.json"))
          grammars = pkg.get("contributes", {}).get("grammars", [])
          paths = [g.get("path") for g in grammars]
          if "./syntaxes/sub.tmLanguage.json" not in paths:
              sys.exit("package.json does not load syntaxes/sub.tmLanguage.json; got %r" % paths)
          langs = pkg.get("contributes", {}).get("languages", [])
          exts = [e for l in langs for e in l.get("extensions", [])]
          if ".sb" not in exts:
              sys.exit("package.json does not claim .sb; got %r" % exts)
          print("extension loads the grammar and claims .sb")
          PY
