name: Release SUB Language

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta'
      - 'v*.*.*-alpha'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.8-alpha)'
        required: true
        type: string

jobs:
  # ─────────────────────────────────────────────
  # 0. Verify before releasing anything
  # ─────────────────────────────────────────────
  # Nothing here gated on the tests, so a tag could publish binaries that
  # had never been run. Every build job now waits on this.
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      numeric: ${{ steps.version.outputs.NUMERIC }}
      wix: ${{ steps.version.outputs.WIX_VERSION }}
      prerelease: ${{ steps.version.outputs.PRERELEASE }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          NUMERIC="${RAW#v}"; NUMERIC="${NUMERIC%%-*}"
          # WiX wants four numeric parts.
          WIX="$NUMERIC"
          while [ "$(echo "$WIX" | tr -cd . | wc -c)" -lt 3 ]; do WIX="$WIX.0"; done
          case "$RAW" in *-alpha*|*-beta*|*-rc*) PRE=true ;; *) PRE=false ;; esac
          {
            echo "VERSION=$RAW"
            echo "NUMERIC=$NUMERIC"
            echo "WIX_VERSION=$WIX"
            echo "PRERELEASE=$PRE"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $RAW (numeric $NUMERIC, wix $WIX, prerelease $PRE)"

      - name: Build
        run: make all

      - name: Tools report the version being released
        # The tag and what `sub --version` prints have to agree. They did
        # not: the tags ran v1.0.x while SUB_VERSION in the source said
        # 2.0.0, so every published binary reported a version that was
        # never released.
        run: |
          for tool in sub subc subi; do
            printed=$(./$tool --version | tr -d '\r' | grep -E "^$tool " | awk '{print $2}')
            if [ "$printed" != "${{ steps.version.outputs.NUMERIC }}" ]; then
              echo "::error::$tool --version says '$printed', but the release is ${{ steps.version.outputs.VERSION }}."
              echo "::error::Update SUB_VERSION in src/include/sub_compiler.h before tagging."
              exit 1
            fi
            echo "$tool $printed"
          done

      - name: Regression tests
        run: python3 tests/run_tests.py

      - name: Conformance
        run: python3 tests/conformance.py native native-c c cpp python

      - name: Native backend needs no toolchain
        run: python3 tests/native_backend.py

  # ─────────────────────────────────────────────
  # 1. Build Linux & macOS binaries
  # ─────────────────────────────────────────────
  build-unix:
    needs: verify
    name: build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            binary_suffix: ''
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            binary_suffix: ''
          - os: macos-26
            platform: macos
            arch: arm64
            binary_suffix: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup build environment
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y gcc make
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install gcc make || true
          fi

      - name: Build all tools
        run: |
          make clean
          make all

      - name: Smoke test all tools
        run: |
          echo 'let x = 42' > /tmp/smoke.sb
          echo 'print(x)' >> /tmp/smoke.sb
          ./sub /tmp/smoke.sb python
          ./subc /tmp/smoke.sb -o /tmp/smoke_bin
          /tmp/smoke_bin
          ./subi /tmp/smoke.sb

      - name: Package release archive (.tar.gz)
        run: |
          ARCHIVE_NAME="sub-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "${ARCHIVE_NAME}"
          cp sub subc subi "${ARCHIVE_NAME}/"
          # The standard library, where `import "math"` looks for it: the
          # module resolver checks stdlib/ beside the executable.
          cp -r stdlib "${ARCHIVE_NAME}/"
          cp LICENSE README.md "${ARCHIVE_NAME}/"
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}/"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: sub-${{ matrix.platform }}-${{ matrix.arch }}
          path: sub-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          retention-days: 5

  # ─────────────────────────────────────────────
  # 2. Build Linux packages (.deb and .rpm)
  # ─────────────────────────────────────────────
  # Shared with CI, which builds, lints, installs and removes both packages
  # on every push. This job used to assemble the .deb inline, which meant
  # the only way to find out whether a packaging change worked was to tag a
  # release and read the complaints.
  build-linux-packages:
    name: linux packages
    needs: [verify, build-unix]
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.verify.outputs.numeric }}
      upload: true

  # ─────────────────────────────────────────────
  # 3. Build Windows MSI installer
  # ─────────────────────────────────────────────
  # Shared with CI, which builds it on every push, so a release is never the
  # first time the installer has been put together.
  build-windows-msi:
    name: build (windows-x86_64 MSI)
    needs: verify
    uses: ./.github/workflows/msi.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      wix_version: ${{ needs.verify.outputs.wix }}
      upload: true

  # ─────────────────────────────────────────────
  # 3b. Build the macOS .pkg installer
  # ─────────────────────────────────────────────
  # A double-clickable installer with a licence page, rather than a tarball
  # the user has to unpack into the right place by hand.
  build-macos-pkg:
    name: build (macos-arm64 .pkg)
    needs: verify
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build the tools
        run: |
          make clean
          make all

      - name: Build the .pkg
        run: installer/macos/build-pkg.sh "${{ needs.verify.outputs.numeric }}" dist

      - name: The package installs and the tools work
        # `installer -pkg` on the live system, because a package that builds
        # is not the same as a package that installs. Then run a program
        # that imports from the standard library from somewhere other than
        # the source tree, which is what catches a stdlib in the wrong place.
        run: |
          sudo installer -pkg dist/*.pkg -target /
          cd /tmp
          command -v subi
          subi --version
          printf 'import "strings"\nprintln(capitalize("installed"))\n' > check.sb
          test "$(subi check.sb)" = "Installed"
          subc check.sb -o check_bin && test "$(./check_bin)" = "Installed"
          test -f /usr/local/share/man/man1/subi.1

      - name: Upload the .pkg
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/*.pkg
          retention-days: 5

  # ─────────────────────────────────────────────
  # 4. Create GitHub Release
  # ─────────────────────────────────────────────
  create-release:
    needs: [verify, build-unix, build-linux-packages, build-windows-msi,
            build-macos-pkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p ./release-assets
          find ./artifacts -type f \( -name '*.tar.gz' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.msi' -o -name '*.pkg' \) \
            -exec cp {} ./release-assets/ \;
          echo "Release assets:"
          ls -lh ./release-assets/
          for want in sub-linux-x86_64.tar.gz sub-linux-arm64.tar.gz \
                      sub-macos-arm64.tar.gz; do
            test -f "./release-assets/$want" || { echo "::error::missing $want"; exit 1; }
          done
          ls ./release-assets/*.msi >/dev/null || { echo "::error::no Windows MSI"; exit 1; }
          ls ./release-assets/*.pkg >/dev/null || { echo "::error::no macOS .pkg"; exit 1; }
          # Two of each: x86_64 and arm64. A count, not a glob, because one
          # architecture failing to build is exactly the case a glob passes.
          for kind in deb rpm; do
            n=$(ls ./release-assets/*.$kind 2>/dev/null | grep -vc '\.src\.rpm$' || true)
            test "$n" -ge 2 || { echo "::error::expected 2 .$kind packages, found $n"; exit 1; }
          done

      - name: Generate checksums
        working-directory: ./release-assets
        run: |
          sha256sum * > checksums-sha256.txt
          echo "Checksums:"
          cat checksums-sha256.txt

      - name: Generate release notes
        id: release_notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # Only this version's section. `cat docs/RELEASE_NOTES.md` put the
          # notes for every release ever made into every release.
          SECTION=$(awk -v want="## $VERSION" '
            $0 == want { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' docs/RELEASE_NOTES.md)
          if [ -z "$(echo "$SECTION" | tr -d '[:space:]')" ]; then
            echo "::warning::docs/RELEASE_NOTES.md has no section for $VERSION; using the commit log"
            PREV=$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              SECTION=$(printf '### Changes since %s\n\n' "$PREV"; git log --no-merges --format='- %s' "$PREV..$VERSION")
            else
              SECTION=$(git log --no-merges --format='- %s' -20)
            fi
          fi
          {
            echo "## SUB Language $VERSION";
            echo "";
            echo "$SECTION";
            echo "";
            echo "---";
            echo "";
            echo "### Downloads";
            echo "";
            echo "Each archive / package contains the full SUB toolchain: \`sub\` (transpiler), \`subc\` (native compiler), and \`subi\` (interpreter).";
            echo "";
            echo "| Platform | Format | Architecture | File |";
            echo "|----------|--------|-------------|------|";
            echo "| Linux | .tar.gz | x86_64 | \`sub-linux-x86_64.tar.gz\` |";
            echo "| Linux | .tar.gz | arm64  | \`sub-linux-arm64.tar.gz\` |";
            echo "| Linux | .deb (Debian/Ubuntu) | x86_64 | \`sub-lang_*_amd64.deb\` |";
            echo "| Linux | .deb (Debian/Ubuntu) | arm64  | \`sub-lang_*_arm64.deb\` |";
            echo "| Linux | .rpm (Fedora/RHEL/openSUSE) | x86_64 | \`sub-lang-*.x86_64.rpm\` |";
            echo "| Linux | .rpm (Fedora/RHEL/openSUSE) | arm64  | \`sub-lang-*.aarch64.rpm\` |";
            echo "| Linux | .src.rpm (rebuild it yourself) | any | \`sub-lang-*.src.rpm\` |";
            echo "| macOS | .pkg installer | arm64 (Apple Silicon) | \`sub-lang-*-macos-arm64.pkg\` |";
            echo "| macOS | .tar.gz | arm64 (Apple Silicon) | \`sub-macos-arm64.tar.gz\` |";
            echo "| Windows | .msi installer | x86_64 | \`sub-lang-*-windows-x86_64.msi\` |";
            echo "";
            echo "### Installing";
            echo "";
            echo "\`\`\`bash";
            echo "# Debian, Ubuntu, Mint";
            echo "sudo dpkg -i sub-lang_*_amd64.deb";
            echo "";
            echo "# Fedora, RHEL, CentOS Stream, openSUSE";
            echo "sudo rpm -i sub-lang-*.x86_64.rpm      # or: sudo dnf install ./sub-lang-*.rpm";
            echo "";
            echo "# macOS - double-click the .pkg, or:";
            echo "sudo installer -pkg sub-lang-*-macos-arm64.pkg -target /";
            echo "\`\`\`";
            echo "";
            echo "The Linux packages and the macOS \`.pkg\` put the three tools on your \`PATH\`, install the standard library where \`import\` finds it, and add \`man sub\`, \`man subc\` and \`man subi\`. On Windows the \`.msi\` does the same and associates \`.sb\` files with the interpreter.";
            echo "";
            echo "### Verify checksums";
            echo "\`\`\`bash";
            echo "sha256sum -c checksums-sha256.txt";
            echo "\`\`\`";
          } > release_notes.md
          echo "--- release notes ---"
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.version }}
          name: SUB Language ${{ needs.verify.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.verify.outputs.prerelease }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "✅ Release ${{ needs.verify.outputs.version }} created successfully!"
          echo "📦 Artifacts: Linux (x86_64, arm64) tarballs + .deb, macOS (arm64) tarball, Windows MSI"
          echo "🔧 Tools: sub (transpiler), subc (native compiler), subi (interpreter)"
          echo "🔗 View release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.verify.outputs.version }}"
