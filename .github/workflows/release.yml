name: Release SUB Language

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta'
      - 'v*.*.*-alpha'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.8-alpha)'
        required: true
        type: string

jobs:
  # ─────────────────────────────────────────────
  # 0. Verify before releasing anything
  # ─────────────────────────────────────────────
  # Nothing here gated on the tests, so a tag could publish binaries that
  # had never been run. Every build job now waits on this.
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      numeric: ${{ steps.version.outputs.NUMERIC }}
      wix: ${{ steps.version.outputs.WIX_VERSION }}
      prerelease: ${{ steps.version.outputs.PRERELEASE }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          NUMERIC="${RAW#v}"; NUMERIC="${NUMERIC%%-*}"
          # WiX wants four numeric parts.
          WIX="$NUMERIC"
          while [ "$(echo "$WIX" | tr -cd . | wc -c)" -lt 3 ]; do WIX="$WIX.0"; done
          case "$RAW" in *-alpha*|*-beta*|*-rc*) PRE=true ;; *) PRE=false ;; esac
          {
            echo "VERSION=$RAW"
            echo "NUMERIC=$NUMERIC"
            echo "WIX_VERSION=$WIX"
            echo "PRERELEASE=$PRE"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $RAW (numeric $NUMERIC, wix $WIX, prerelease $PRE)"

      - name: Build
        run: make all

      - name: Tools report the version being released
        # The tag and what `sub --version` prints have to agree. They did
        # not: the tags ran v1.0.x while SUB_VERSION in the source said
        # 2.0.0, so every published binary reported a version that was
        # never released.
        run: |
          for tool in sub subc subi; do
            printed=$(./$tool --version | tr -d '\r' | grep -E "^$tool " | awk '{print $2}')
            if [ "$printed" != "${{ steps.version.outputs.NUMERIC }}" ]; then
              echo "::error::$tool --version says '$printed', but the release is ${{ steps.version.outputs.VERSION }}."
              echo "::error::Update SUB_VERSION in src/include/sub_compiler.h before tagging."
              exit 1
            fi
            echo "$tool $printed"
          done

      - name: Regression tests
        run: python3 tests/run_tests.py

      - name: Conformance
        run: python3 tests/conformance.py native native-c c cpp python

      - name: Native backend needs no toolchain
        run: python3 tests/native_backend.py

  # ─────────────────────────────────────────────
  # 1. Build Linux & macOS binaries
  # ─────────────────────────────────────────────
  build-unix:
    needs: verify
    name: build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            binary_suffix: ''
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            binary_suffix: ''
          - os: macos-26
            platform: macos
            arch: arm64
            binary_suffix: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup build environment
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y gcc make
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install gcc make || true
          fi

      - name: Build all tools
        run: |
          make clean
          make all

      - name: Smoke test all tools
        run: |
          echo 'let x = 42' > /tmp/smoke.sb
          echo 'print(x)' >> /tmp/smoke.sb
          ./sub /tmp/smoke.sb python
          ./subc /tmp/smoke.sb -o /tmp/smoke_bin
          /tmp/smoke_bin
          ./subi /tmp/smoke.sb

      - name: Package release archive (.tar.gz)
        run: |
          ARCHIVE_NAME="sub-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "${ARCHIVE_NAME}"
          cp sub subc subi "${ARCHIVE_NAME}/"
          cp LICENSE README.md "${ARCHIVE_NAME}/"
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}/"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: sub-${{ matrix.platform }}-${{ matrix.arch }}
          path: sub-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          retention-days: 5

  # ─────────────────────────────────────────────
  # 2. Build Linux packages (.deb)
  # ─────────────────────────────────────────────
  build-linux-packages:
    name: linux packages (${{ matrix.arch }})
    needs: [verify, build-unix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            deb_arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            deb_arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Build binaries
        run: |
          make clean
          make all

      # ── .deb (Debian / Ubuntu) ───────────────
      - name: Build .deb package
        run: |
          PKG="sub-lang_${{ needs.verify.outputs.numeric }}_${{ matrix.deb_arch }}"
          mkdir -p "${PKG}/DEBIAN"
          mkdir -p "${PKG}/usr/local/bin"
          mkdir -p "${PKG}/usr/share/doc/sub-lang"

          cp sub subc subi "${PKG}/usr/local/bin/"
          cp LICENSE README.md "${PKG}/usr/share/doc/sub-lang/"

          printf '%s\n' \
            "Package: sub-lang" \
            "Version: ${{ needs.verify.outputs.numeric }}" \
            "Section: devel" \
            "Priority: optional" \
            "Architecture: ${{ matrix.deb_arch }}" \
            "Maintainer: SUB Language Project <noreply@github.com>" \
            "Description: SUB Programming Language Toolchain" \
            " A modern programming language with transpiler (sub)," \
            " native compiler (subc), and interpreter (subi)." \
            > "${PKG}/DEBIAN/control"

          cat "${PKG}/DEBIAN/control"
          dpkg-deb --build "${PKG}"
          echo "Built: ${PKG}.deb"


      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: "*.deb"
          retention-days: 5


  # ─────────────────────────────────────────────
  # 3. Build Windows MSI installer
  # ─────────────────────────────────────────────
  build-windows-msi:
    name: build (windows-x86_64 MSI)
    needs: verify
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make
          msystem: MINGW64

      - name: Build all tools
        shell: msys2 {0}
        run: |
          make clean
          make all

      - name: Smoke test all tools
        shell: msys2 {0}
        run: |
          echo 'let x = 42' > smoke.sb
          echo 'print(x)' >> smoke.sb
          ./sub.exe smoke.sb python
          ./subc.exe smoke.sb -o smoke_bin
          ./smoke_bin.exe
          ./subi.exe smoke.sb

      - name: Stage binaries for WiX
        shell: pwsh
        run: |
          # WiX resolves Source paths relative to the .wxs file location.
          # Copy everything the installer needs into installer\windows\ so
          # the bare filenames in the wxs Source attributes resolve correctly.
          $dest = "installer\windows"
          Copy-Item sub.exe, subc.exe, subi.exe, LICENSE, README.md -Destination $dest -Force
          Write-Host "Staged files:"
          Get-ChildItem $dest

      - name: Install WiX Toolset v4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add the WiX UI extension
        shell: pwsh
        run: wix extension add --global WixToolset.UI.wixext/4.0.5

      - name: Build MSI
        shell: pwsh
        run: |
          # The version goes in as a preprocessor variable. This step used to
          # rewrite sub-lang.wxs with a regular expression first, which meant
          # the file that shipped was never the file in the repository.
          # -bindpath so the licence RTF, the icon and the staged binaries
          # all resolve regardless of the working directory.
          wix build installer\windows\sub-lang.wxs `
            -bindpath installer\windows `
            -d Version=${{ needs.verify.outputs.wix }} `
            -ext WixToolset.UI.wixext `
            -o sub-lang-${{ needs.verify.outputs.version }}-windows-x86_64.msi
          if (-not (Test-Path "sub-lang-${{ needs.verify.outputs.version }}-windows-x86_64.msi")) {
            throw "wix build reported success but produced no .msi"
          }

      - name: Check the MSI
        shell: pwsh
        run: |
          # An MSI that installs nothing still builds, so look inside: the
          # three tools have to be in there, and the recorded version has to
          # be the one being released.
          $msi = Get-ChildItem *.msi | Select-Object -First 1
          Write-Host ("{0}  {1:N0} bytes" -f $msi.Name, $msi.Length)
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember(
                  "OpenDatabase", "InvokeMethod", $null, $installer, @($msi.FullName, 0))
          function Query($sql) {
            $view = $db.GetType().InvokeMember("OpenView", "InvokeMethod", $null, $db, @($sql))
            $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null)
            $rows = @()
            while ($true) {
              $rec = $view.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $view, $null)
              if (-not $rec) { break }
              $rows += $rec.GetType().InvokeMember("StringData", "GetProperty", $null, $rec, @(1))
            }
            return $rows
          }
          $files = Query "SELECT FileName FROM File"
          Write-Host "Files in the package: $($files -join ', ')"
          foreach ($want in @("sub.exe", "subc.exe", "subi.exe")) {
            if (-not ($files -match [regex]::Escape($want))) { throw "$want is missing from the MSI" }
          }
          $ver = Query "SELECT Value FROM Property WHERE Property='ProductVersion'"
          Write-Host "ProductVersion: $ver"
          if ($ver -ne "${{ needs.verify.outputs.wix }}") {
            throw "MSI ProductVersion is $ver, expected ${{ needs.verify.outputs.wix }}"
          }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: "*.msi"
          retention-days: 5

  # ─────────────────────────────────────────────
  # 4. Create GitHub Release
  # ─────────────────────────────────────────────
  create-release:
    needs: [verify, build-unix, build-linux-packages, build-windows-msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p ./release-assets
          find ./artifacts -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.msi' \) \
            -exec cp {} ./release-assets/ \;
          echo "Release assets:"
          ls -lh ./release-assets/
          for want in sub-linux-x86_64.tar.gz sub-linux-arm64.tar.gz \
                      sub-macos-arm64.tar.gz; do
            test -f "./release-assets/$want" || { echo "::error::missing $want"; exit 1; }
          done
          ls ./release-assets/*.msi >/dev/null || { echo "::error::no Windows MSI"; exit 1; }
          ls ./release-assets/*.deb >/dev/null || { echo "::error::no .deb packages"; exit 1; }

      - name: Generate checksums
        working-directory: ./release-assets
        run: |
          sha256sum * > checksums-sha256.txt
          echo "Checksums:"
          cat checksums-sha256.txt

      - name: Generate release notes
        id: release_notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # Only this version's section. `cat docs/RELEASE_NOTES.md` put the
          # notes for every release ever made into every release.
          SECTION=$(awk -v want="## $VERSION" '
            $0 == want { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' docs/RELEASE_NOTES.md)
          if [ -z "$(echo "$SECTION" | tr -d '[:space:]')" ]; then
            echo "::warning::docs/RELEASE_NOTES.md has no section for $VERSION; using the commit log"
            PREV=$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              SECTION=$(printf '### Changes since %s\n\n' "$PREV"; git log --no-merges --format='- %s' "$PREV..$VERSION")
            else
              SECTION=$(git log --no-merges --format='- %s' -20)
            fi
          fi
          {
            echo "## SUB Language $VERSION";
            echo "";
            echo "$SECTION";
            echo "";
            echo "---";
            echo "";
            echo "### Downloads";
            echo "";
            echo "Each archive / package contains the full SUB toolchain: \`sub\` (transpiler), \`subc\` (native compiler), and \`subi\` (interpreter).";
            echo "";
            echo "| Platform | Format | Architecture | File |";
            echo "|----------|--------|-------------|------|";
            echo "| Linux | .tar.gz | x86_64 | \`sub-linux-x86_64.tar.gz\` |";
            echo "| Linux | .tar.gz | arm64  | \`sub-linux-arm64.tar.gz\` |";
            echo "| Linux | .deb (Debian/Ubuntu) | x86_64 | \`sub-lang_*_amd64.deb\` |";
            echo "| Linux | .deb (Debian/Ubuntu) | arm64  | \`sub-lang_*_arm64.deb\` |";

            echo "| macOS | .tar.gz | arm64 (Apple Silicon) | \`sub-macos-arm64.tar.gz\` |";
            echo "| Windows | .msi installer | x86_64 | \`sub-lang-*-windows-x86_64.msi\` |";
            echo "";
            echo "> **Windows users**: Run the \`.msi\` installer — it installs all three tools and adds them to your system PATH automatically.";
            echo "";
            echo "### Verify checksums";
            echo "\`\`\`bash";
            echo "sha256sum -c checksums-sha256.txt";
            echo "\`\`\`";
          } > release_notes.md
          echo "--- release notes ---"
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.version }}
          name: SUB Language ${{ needs.verify.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.verify.outputs.prerelease }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "✅ Release ${{ needs.verify.outputs.version }} created successfully!"
          echo "📦 Artifacts: Linux (x86_64, arm64) tarballs + .deb, macOS (arm64) tarball, Windows MSI"
          echo "🔧 Tools: sub (transpiler), subc (native compiler), subi (interpreter)"
          echo "🔗 View release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.verify.outputs.version }}"
